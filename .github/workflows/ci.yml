name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Pruebas de la lógica, la API y la infraestructura
        run: npm test
      - name: La plantilla de CloudFormation se genera
        run: npm run synth -- -q
      - name: Pruebas de punta a punta (escritorio y celular)
        run: |
          npx playwright install --with-deps chromium
          npm run e2e -w web

  desplegar:
    # Solo corre si ya se configuró el rol de AWS en los secretos del repositorio.
    needs: pruebas
    if: github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - run: npm run deploy -w infra -- -c sitio=${{ vars.SITIO }} -c conservarDatos=true
